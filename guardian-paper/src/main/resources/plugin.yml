name: Guardian
version: '${version}'
main: com.badwolfmc.guardian.paper.GuardianPaperPlugin
api-version: '26.2'
authors: [BadWolfMC]
description: Guardian Admission and Protection for Paper.
softdepend: [floodgate, LuckPerms]
commands:
  guardian:
    description: Guardian administrative commands.
    usage: /guardian artifacts scan
permissions:
  guardian.artifacts.scan:
    description: Scan artifact-import and merge exact identities into artifacts.yml.
    default: op
