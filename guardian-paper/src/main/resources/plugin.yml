name: Guardian
version: '${version}'
main: com.badwolfmc.guardian.paper.GuardianPaperPlugin
api-version: '26.3'
authors: [BadWolfMC]
description: Guardian Admission and Protection for Paper.
softdepend: [Geyser-Spigot, floodgate, LuckPerms]
permissions:
  guardian.command.status:
    description: View Guardian state on this Paper host.
    default: op
  guardian.command.validate:
    description: Validate Paper-owned Guardian files without activation.
    default: op
  guardian.command.reload:
    description: Atomically reload Paper-owned Guardian runtime state.
    default: op
  guardian.command.inspect:
    description: Inspect active Guardian state held by this Paper host.
    default: op
  guardian.command.artifacts.scan:
    description: Scan the authoritative local artifact catalog when Paper owns Admission.
    default: op
