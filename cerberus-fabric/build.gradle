plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':guardian-protocol')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = 'cerberus-fabric'
}

def cerberusVersion = version.toString()

processResources {
    inputs.property 'version', cerberusVersion
    filesMatching('fabric.mod.json') {
        expand version: cerberusVersion
    }
}

tasks.named('jar') {
    dependsOn project(':guardian-protocol').tasks.named('classes')
    from(project(':guardian-protocol').sourceSets.main.output)
}

sourceSets {
    releaseTool {
        java.srcDir 'src/releaseTool/java'
    }
}

dependencies {
    releaseToolImplementation project(':guardian-protocol')
}

tasks.register('signCerberusRelease', JavaExec) {
    group = 'distribution'
    description = 'Creates an official Cerberus JAR with Ed25519 release identity metadata.'
    dependsOn tasks.named('remapJar'), tasks.named('releaseToolClasses')
    classpath = sourceSets.releaseTool.runtimeClasspath
    mainClass = 'com.badwolfmc.cerberus.release.CerberusReleaseSigner'
    doFirst {
        def privateKey = providers.gradleProperty('cerberusReleasePrivateKey').orNull
        if (privateKey == null || privateKey.isBlank()) {
            throw new GradleException('signCerberusRelease requires -PcerberusReleasePrivateKey=/path/to/ed25519-private-key.pem')
        }
        def unsignedJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def signedJar = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}-signed.jar").get().asFile
        args unsignedJar.absolutePath, signedJar.absolutePath, privateKey, project.version.toString()
        def serverTrust = providers.gradleProperty('guardianServerAuthPublicKeys').orNull
        if (serverTrust != null && !serverTrust.isBlank()) {
            args serverTrust
        }
    }
}


tasks.register('generateGuardianServerIdentity', JavaExec) {
    group = 'distribution'
    description = 'Generates an Ed25519 Guardian server-authentication private key and public trust-anchor file.'
    dependsOn tasks.named('releaseToolClasses')
    classpath = sourceSets.releaseTool.runtimeClasspath
    mainClass = 'com.badwolfmc.cerberus.release.GuardianServerIdentityGenerator'
    doFirst {
        def outputDirectory = providers.gradleProperty('guardianServerIdentityDirectory').orNull
        if (outputDirectory == null || outputDirectory.isBlank()) {
            throw new GradleException('generateGuardianServerIdentity requires -PguardianServerIdentityDirectory=/secure/output/directory')
        }
        def output = file(outputDirectory)
        args new File(output, 'guardian-server-auth.key').absolutePath,
             new File(output, 'guardian-server-auth.pub').absolutePath
    }
}
