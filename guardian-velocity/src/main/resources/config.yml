# Guardian-Velocity owns network Admission on a proxy deployment.
schema-version: 2

deployment:
  # Explicit so a copied/misplaced config fails loudly rather than changing authority accidentally.
  authority: velocity

locale:
  default: en_us

logging:
  # NORMAL emits one concise authoritative result per Admission. DEBUG adds lifecycle diagnostics.
  level: NORMAL

admission:
  # Time allowed for profile resolution + Cerberus CONFIGURATION attestation where required.
  handshake-timeout-seconds: 10

  # Optional privacy hardening for Cerberus manifests. When enabled, Guardian-Velocity
  # signs each challenge with guardian-server-auth.key in this plugin data directory.
  # Official Cerberus releases must carry the corresponding public trust anchor.
  server-authentication:
    enabled: false

# Guardian-Velocity automatically generates proxy-assertion.key in this plugin
# data directory on first startup. Keep it private and copy the same file
# unchanged to plugins/Guardian/proxy-assertion.key on every Paper backend
# configured with admission.authority: velocity.
