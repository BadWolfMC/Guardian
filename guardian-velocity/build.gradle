plugins {
    id 'java-library'
}

dependencies {
    implementation project(':guardian-core')
    implementation project(':guardian-protocol')
    implementation "org.snakeyaml:snakeyaml-engine:${snakeyaml_engine_version}"

    compileOnly "com.velocitypowered:velocity-api:${velocity_api_version}"
    compileOnly "org.geysermc.geyser:api:${geyser_api_version}"
    compileOnly "org.geysermc.floodgate:api:${floodgate_api_version}"
    compileOnly "net.luckperms:api:${luckperms_api_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "com.velocitypowered:velocity-api:${velocity_api_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = 'guardian-velocity'
}


def guardianVersion = version.toString()
if (!(guardianVersion ==~ /[0-9A-Za-z][0-9A-Za-z._-]{0,63}/)) {
    throw new GradleException('Guardian version must match ^[0-9A-Za-z][0-9A-Za-z._-]{0,63}$')
}

processResources {
    inputs.property 'version', guardianVersion
    filesMatching('velocity-plugin.json') {
        expand version: guardianVersion
    }
}

tasks.named('jar') {
    from(rootProject.file('LICENSE')) { into 'META-INF'; rename { 'LICENSE-GPL-3.0.txt' } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF'; rename { 'THIRD-PARTY-NOTICES.md' } }
    from(rootProject.file('licenses/Apache-2.0.txt')) { into 'META-INF/licenses'; rename { 'Apache-2.0.txt' } }

    from { configurations.runtimeClasspath.findAll { it.name.startsWith('snakeyaml-engine-') }.collect { zipTree(it) } }
    dependsOn project(':guardian-core').tasks.named('classes')
    dependsOn project(':guardian-protocol').tasks.named('classes')
    from(project(':guardian-core').sourceSets.main.output)
    from(project(':guardian-protocol').sourceSets.main.output)
}

sourceSets {
    main.resources.srcDir rootProject.file('shared-resources')
}
